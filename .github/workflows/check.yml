# The quick checks on every push: the engine's tests, the editor's script edits, the settings check, and the
# web player built (the same build as "Publish the player", which stays manual).
# Nothing is published; the built site is kept 3 days as an artifact, so the
# player can be opened and pictured exactly as it was built.
name: Check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: |
          sudo apt-get install -y ninja-build
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/loop_tests
      - name: The editor's script edits (and the engine reads them)
        run: node tests/editor_source_test.js
      - name: The live recorder (what the phone's visits save)
        run: node tests/recorder_test.js
      - name: The editor and the engine agree on every setting
        run: node tools/check_settings.js
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: The web player
        run: ./tools/build_site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 3
