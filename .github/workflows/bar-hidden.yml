# Puts LOOP3D's player, with the bar, on a hidden link beside the live bar:
#   https://joshuavelasco.com/bar/loop3d/?scene=bar
# and the hub's new front page (web/hub/, docs/HUB.md) in a folder under it:
#   https://joshuavelasco.com/bar/loop3d/hub/
# Runs when started by hand (Actions → "Bar on the hidden link" → Run), and
# while the hub is being built, when the hub's page or this file changes on
# the hub's branch (the owner's go, 2026-11-11). It never deletes anything on
# the server: the live bar, its PHP and its labs stay exactly as they are.
#
# Needs three secrets in this repo (Settings → Secrets and variables →
# Actions), the same values as in Barcode162/3D: IONOS_SFTP_HOST,
# IONOS_SFTP_USER, IONOS_SFTP_PASSWORD.
name: Bar on the hidden link
on:
  workflow_dispatch:
  push:
    branches: ['claude/dazzling-mccarthy-fcaffw']
    paths: ['.github/workflows/bar-hidden.yml', 'web/hub/**']
permissions:
  contents: read
env:
  IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
  IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
  TARGET: home/bar/loop3d
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      EM_CACHE: ${{ github.workspace }}/.em-cache  # kept between runs (below)
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      # Emscripten's downloads (the WebGPU port from GitHub's releases) kept
      # between runs: that server's time-outs failed whole runs (2026-11-08)
      - uses: actions/cache@v4
        with:
          path: .em-cache
          key: em-cache-6.0.13-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: em-cache-6.0.13-
      - name: Engine tests
        timeout-minutes: 20
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/loop_tests
          ./build/loop check projects/bar3d/bar.loop
      - name: The site
        timeout-minutes: 20
        run: |
          sudo apt-get install -y ninja-build lftp >/dev/null
          for i in 1 2 3; do ./tools/build_site.sh && break; [ $i = 3 ] && exit 1; sleep 30; done
      - name: The hub's front page, beside the player
        run: |
          mkdir -p site/hub && cp -r web/hub/. site/hub/
          # here the player is one folder up; at the real front door these links are set again
          sed -i 's#https://barcode162.github.io/LOOP3D/#../#g' site/hub/index.html
          ! grep -q "github.io" site/hub/index.html
      - name: Keys saved with a space or a new line at their end still work
        run: |
          for n in IONOS_SFTP_HOST IONOS_SFTP_USER; do
            t="$(printf '%s' "${!n}" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$t" ] && echo "::add-mask::$t" && echo "$n=$t" >> "$GITHUB_ENV"
          done
      - name: Upload (adds and replaces files, never deletes)
        timeout-minutes: 20
        if: env.IONOS_SFTP_HOST != ''
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          cd site
          lftp --env-password -u "$IONOS_SFTP_USER" "sftp://$IONOS_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mkdir -p -f $TARGET
          mirror -R --verbose --no-perms --parallel=4 . $TARGET
          cd $TARGET
          mput index.html editor.html player.js player.wasm
          bye
          EOF
      - name: The live pages answer
        if: env.IONOS_SFTP_HOST != ''
        run: |
          for u in bar/loop3d/ bar/loop3d/hub/ bar/loop3d/hub/images/hero_loft_night.jpg bar/loop3d/player.wasm; do
            code=$(curl -sS -m 30 -o got -w '%{http_code}' "https://joshuavelasco.com/$u"); echo "$code  $(wc -c < got) bytes  /$u"
            [ "$code" = 200 ]
          done
          curl -sS -m 30 https://joshuavelasco.com/bar/loop3d/hub/ | grep -q "J Production"
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' https://joshuavelasco.com/bar/); echo "$code  the live bar, untouched"
      - name: No secrets yet
        if: env.IONOS_SFTP_HOST == ''
        run: |
          echo "The IONOS secrets aren't set in this repo yet: built and checked, nothing uploaded."
          exit 1
