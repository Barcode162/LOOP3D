# Builds the web player from main and publishes it: https://barcode162.github.io/LOOP3D/
# It only runs when started by hand (Actions → "Publish the player" → Run workflow),
# so nothing changes on the public page until then. Pages serves the gh-pages
# branch: the new site replaces its files in one new commit (its history stays).
name: Publish the player
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EM_CACHE: ${{ github.workspace }}/.em-cache  # kept between runs (below)
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: |
          sudo apt-get install -y ninja-build
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/loop_tests
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      # Emscripten's downloads (the WebGPU port from GitHub's releases) kept
      # between runs: that server's time-outs failed whole runs (2026-11-08)
      - uses: actions/cache@v4
        with:
          path: .em-cache
          key: em-cache-6.0.13-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: em-cache-6.0.13-
      - name: The site
        run: for i in 1 2 3; do ./tools/build_site.sh && exit 0; sleep 30; done; exit 1
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin gh-pages
          git worktree add --detach pub FETCH_HEAD
          cd pub
          git rm -rq --ignore-unmatch .
          cp -r ../site/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "the public page already has this build"; exit 0; fi
          git commit -q -m "Site: from main ($(git -C .. rev-parse --short HEAD))"
          git push origin HEAD:gh-pages
