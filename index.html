<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Loop3D Player</title>
<link rel="icon" href="data:,">
<meta name="loop-build" content="5e2c345 2026-11-05">
<style>
  :root { --ink: #f4efe6; --dim: #b9ae9c; --glass: rgba(18, 14, 10, 0.55); --line: rgba(255, 220, 170, 0.18); --amber: #ffb35c; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 15px/1.35 -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #view, #trailer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #trailer { object-fit: cover; display: none; background: #000; }
  .bar { position: fixed; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 10px max(12px, env(safe-area-inset-left)); pointer-events: none; }
  .top { top: env(safe-area-inset-top); justify-content: space-between; }
  .bottom { bottom: max(10px, env(safe-area-inset-bottom)); justify-content: center; flex-wrap: wrap; }
  .chip, button, select { pointer-events: auto; background: var(--glass); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font: inherit; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  button.on { border-color: var(--amber); color: var(--amber); }
  #title { font-weight: 650; letter-spacing: 0.02em; }
  #stats { font: 12px ui-monospace, monospace; color: var(--dim); }
  #note.loading::after { content: ''; display: block; width: 28px; height: 28px; margin: 12px auto 0; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--amber); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #note { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: min(520px, 86vw); text-align: center; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 18px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #lines { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); width: min(680px, 90vw); text-align: center; pointer-events: none; }
  #lines .line { display: inline-block; margin: 4px auto; padding: 8px 14px; border-radius: 12px; background: rgba(10, 8, 6, 0.6); font-size: 17px; line-height: 1.4; transition: opacity 0.6s; }
  #lines .who { color: var(--amber); font-weight: 650; margin-right: 6px; }
  #ask { position: fixed; inset: auto 0 calc(80px + env(safe-area-inset-bottom)) 0; display: none; flex-direction: column; align-items: center; gap: 8px; }
  #ask .q { background: var(--glass); padding: 10px 16px; border-radius: 14px; font-size: 17px; }
  #ask button { min-width: min(320px, 80vw); font-size: 16px; }
  #problems { position: fixed; left: 12px; right: 12px; bottom: 70px; max-height: 30vh; overflow: auto; white-space: pre-wrap; font: 12px ui-monospace, monospace; background: rgba(60, 10, 10, 0.75); border-radius: 12px; padding: 10px; display: none; }
  .stick { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,0.04); display: none; }
  .stick i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 210, 160, 0.35); }
  #ls { left: max(24px, env(safe-area-inset-left)); }
  #rs { right: max(24px, env(safe-area-inset-right)); }
  body.game.touch .stick { display: block; }
  #stats { cursor: pointer; pointer-events: auto; }
  #graph { position: fixed; top: calc(56px + env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 240px; height: 90px; background: rgba(10, 8, 6, 0.6); border: 1px solid var(--line); border-radius: 10px; display: none; }
  #bench { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, 92vw); max-height: 80vh; overflow: auto; background: rgba(14, 11, 8, 0.92); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: none; font-size: 13px; }
  #bench h2 { margin: 0 0 8px; font-size: 17px; }
  #bench table { width: 100%; border-collapse: collapse; font: 12px ui-monospace, monospace; }
  #bench td, #bench th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  #bench td:first-child, #bench th:first-child { text-align: left; white-space: normal; }
  #bench .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #benchLive { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translateX(-50%); font: 12px ui-monospace, monospace; color: var(--amber); background: rgba(10, 8, 6, 0.6); padding: 6px 12px; border-radius: 999px; display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<img id="trailer" alt="The cinema render of this scene">
<div class="bar top">
  <span class="chip" id="title">Loop3D</span>
  <span class="chip" id="stats">starting…</span>
</div>
<div class="bar bottom">
  <button id="modeBtn">Movie</button>
  <button id="trailerBtn" title="See the cinema render: the target look">Trailer view</button>
  <button id="soundBtn" title="Sound on (phones need a tap first)">Sound</button>
  <button id="useBtn" title="Use / talk (E)">Use</button>
  <select id="scene" title="Scene">
    <option value="courtyard">Courtyard</option>
  </select>
  <a class="chip" href="editor.html" title="Open the Loop3D editor" style="text-decoration:none">Editor</a>
  <select id="benchSel" title="Measure how smoothly it runs">
    <option value="">Benchmark…</option>
    <option value="scene">This scene</option>
    <option value="story">The whole story (about 30 min)</option>
  </select>
  <select id="quality" title="Quality">
    <option value="0">Phone</option>
    <option value="1">High</option>
    <option value="2">Ultra</option>
  </select>
</div>
<div id="note" class="loading">Loading Loop3D…</div>
<div id="problems"></div>
<div id="lines"></div>
<div id="ask"></div>
<canvas id="graph" width="480" height="180"></canvas>
<div id="benchLive"></div>
<div id="bench"></div>
<div class="stick" id="ls"><i></i></div>
<div class="stick" id="rs"><i></i></div>
<script src="loop_ui.js"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const sceneName = (location.hash.slice(1) || params.get('scene') || 'courtyard').replace(/[^a-z0-9_-]/gi, '');
  const note = document.getElementById('note');
  const problemsBox = document.getElementById('problems');
  const modeBtn = document.getElementById('modeBtn');
  const trailerBtn = document.getElementById('trailerBtn');
  const trailer = document.getElementById('trailer');
  const touch = matchMedia('(pointer: coarse)').matches;
  if (touch) document.body.classList.add('touch');
  if (params.get('ui') === '0') document.querySelectorAll('.bar').forEach((b) => b.style.display = 'none');
  let movie = true, showTrailer = false, M = null;
  // ---- benchmark: plays by itself and measures every scene
  const bench = params.get('bench');            // 'scene' or 'story'
  const benchChoices = (params.get('choices') || '').split(',').filter((x) => x !== '').map(Number);
  let benchAsked = 0, benchSegments = [], benchScene = null, benchTimer = null, benchUse = null, benchStarted = 0;
  const qualityNames = ['Phone', 'High', 'Ultra'];
  const TRACKER = 'https://claude.ai/artifact/VxhkyF5io1MTR4heDYpGVb';

  // a GPU that's gone leaves its last "done" promises rejected: expected, not news
  addEventListener('unhandledrejection', (e) => { if (String(e.reason).includes('external Instance reference')) e.preventDefault(); });
  window.loopNoGpu = () => { note.textContent = 'This browser can\'t do WebGPU yet. On iPhone: Safari 26 or newer; on a computer: Chrome, Edge or Safari.'; };
  window.loopProblems = (t) => { problemsBox.style.display = 'block'; problemsBox.textContent = t; };
  // the loading screen stays until the scene's first frame is on screen
  const showNote = (t, spinning) => { note.textContent = t; note.classList.toggle('loading', !!spinning); note.style.display = 'block'; };
  window.loopShown = () => { note.style.display = 'none'; fade.in(M); };
  window.loopGpuProblem = (t) => { problemsBox.style.display = 'block'; problemsBox.textContent += (problemsBox.textContent ? '\n' : '') + 'Graphics problem: ' + t; };
  window.loopGpuLost = () => showNote('The graphics card restarted. Reconnecting…', true);
  window.loopGpuBack = (q) => {
    const sel = document.getElementById('quality');
    const lowered = +sel.value !== q;
    sel.value = String(q);
    if (lowered) { showNote('Switched to ' + qualityNames[q] + ' so it keeps running smoothly.', false); setTimeout(() => { note.style.display = 'none'; }, 3500); }
    else note.style.display = 'none';
  };
  window.loopSay = (t) => console.log('[say]', t);
  // dialogue lines fade in, stay long enough to read, fade out
  const linesBox = document.getElementById('lines'), askBox = document.getElementById('ask');
  window.loopUi = (kind, speaker, text, options, seconds) => {
    if (kind === 'clear') { linesBox.innerHTML = ''; return; }
    if (kind === 'line') { LoopUI.showLine(linesBox, M, { speaker, text, seconds }); return; }
    if (kind === 'ask' && bench) {
      const pick = benchChoices.length ? benchChoices[(benchAsked++) % benchChoices.length] : 0;
      setTimeout(() => M && M._loop_choose(Math.min(pick, options.split('\n').length - 1)), 1200);
      return;
    }
    if (kind === 'ask') LoopUI.showAsk(askBox, M, { text, options: options.split('\n') }, (i) => M._loop_choose(i));
  };
  const fetchScene = async (n) => { const r = await fetch('scenes/' + encodeURIComponent(n) + '.loop'); if (!r.ok) throw new Error(r.status); return r.text(); };
  // ?from=editor: play the scene the editor has open, edits and all
  const fromEditor = params.get('from') === 'editor' ? LoopUI.handed() : null;
  const fade = LoopUI.fader(document.body);
  let index = { projects: [] }, project = null;
  const titleOf = (n) => { for (const p of index.projects) { const s = p.scenes.find((x) => x.name === n); if (s) return s.title; } return n; };
  function useProject(name) {
    const p = index.projects.find((x) => x.scenes.some((s) => s.name === name) || (x.library || []).includes(name));
    if (!p || p === project) return;
    project = p;
    // the project's settings (project.json), under the scene's own
    const json = JSON.stringify(p.settings || {}), n = M.lengthBytesUTF8(json) + 1, ptr = M._malloc(n);
    M.stringToUTF8(json, ptr, n); M._loop_set_project_settings(ptr); M._free(ptr);
  }
  async function loadScene(name) {
    useProject(name);
    showNote(LoopUI.loadingText(M, titleOf(name)), true);
    const own = fromEditor && fromEditor.scene === name ? fromEditor.text : await fetchScene(name);
    const text = (await LoopUI.assemble(own, fetchScene)).text;
    // let the loading screen reach the screen first: building a world takes a moment
    await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
    const n = M.lengthBytesUTF8(text) + 1, p = M._malloc(n);
    M.stringToUTF8(text, p, n);
    M._loop_run_script(p);
    setTimeout(() => M._free(p), 1000);
    trailer.src = 'scenes/' + encodeURIComponent(name) + '.png';
  }
  window.loopGoTo = async (name) => {
    await fade.out(M);
    linesBox.innerHTML = ''; askBox.style.display = 'none';
    if (bench) {
      benchEndScene();
      const first = benchSegments.length ? benchSegments[0].scene : name;
      if (bench === 'scene' || name === first || benchSegments.length >= 60) { benchFinish(); return; }
      benchBegin(name);
    }
    loadScene(name).catch(() => showNote('Couldn\'t load the scene "' + name + '".', false));
  };
  function benchBegin(name) {
    benchScene = name;
    M._loop_perf_begin();
    clearTimeout(benchTimer);
    // a scene that never moves on is cut off: 60 s, or 6 minutes in a story
    benchTimer = setTimeout(() => { benchEndScene(); benchFinish(); }, (+params.get('seconds') || (bench === 'story' ? 360 : 60)) * 1000);
  }
  function benchEndScene() {
    if (!benchScene) return;
    const r = JSON.parse(M.UTF8ToString(M._loop_perf_end()));
    r.scene = benchScene;
    benchSegments.push(r);
    benchScene = null;
  }
  async function deviceInfo() {
    let gpu = {};
    try { const a = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }); const i = a && (a.info || (a.requestAdapterInfo && await a.requestAdapterInfo())); if (i) gpu = { vendor: i.vendor, architecture: i.architecture, device: i.device, description: i.description }; } catch (e) {}
    return { gpu, ua: navigator.userAgent, dpr: devicePixelRatio, screen: screen.width + 'x' + screen.height, cores: navigator.hardwareConcurrency || 0 };
  }
  async function benchFinish() {
    clearTimeout(benchTimer); clearInterval(benchUse);
    document.getElementById('benchLive').style.display = 'none';
    const segs = benchSegments, frames = segs.reduce((t, x) => t + x.frames, 0), secs = segs.reduce((t, x) => t + x.seconds, 0);
    const result = {
      kind: 'loop3d-bench', v: 1, when: new Date().toISOString(), build: document.querySelector('meta[name=loop-build]').content,
      bench, start: sceneName, quality: qualityNames[+document.getElementById('quality').value], msaa: +(params.get('msaa') || 4),
      device: await deviceInfo(),
      summary: {
        scenes: segs.length, seconds: +secs.toFixed(1), frames, fps: +(secs ? frames / secs : 0).toFixed(2),
        worstLow1Fps: Math.min(...segs.map((x) => x.low1Fps)), worstP99Ms: Math.max(...segs.map((x) => x.p99Ms)), maxMs: Math.max(...segs.map((x) => x.maxMs)),
        hitches: segs.reduce((t, x) => t + x.hitches, 0), avgScale: +(segs.reduce((t, x) => t + x.scaleAvg * x.seconds, 0) / (secs || 1)).toFixed(3),
        worstLoadMs: Math.max(...segs.map((x) => x.loadMs)),
      },
      segments: segs,
    };
    try { const h = JSON.parse(localStorage.getItem('loop3d.bench') || '[]'); h.unshift(result); localStorage.setItem('loop3d.bench', JSON.stringify(h.slice(0, 20))); } catch (e) {}
    window.loopBenchResult = result;
    showBench(result);
  }
  function showBench(r) {
    const box = document.getElementById('bench'), s = r.summary;
    const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    box.innerHTML = `<h2>Benchmark: ${s.fps} fps average, ${s.worstLow1Fps.toFixed(1)} fps at the worst 1%</h2>
      <div>${esc(r.quality)} · ${s.scenes} scene(s) · ${Math.round(s.seconds)} s · ${s.hitches} hitches · ${Math.round(s.avgScale * 100)}% resolution · ${esc(r.device.gpu.description || r.device.gpu.vendor || 'GPU unknown')}</div>
      <table><tr><th>Scene</th><th>fps</th><th>1% low</th><th>p99 ms</th><th>max ms</th><th>hitches</th><th>GPU ms</th><th>CPU ms</th><th>res</th><th>load ms</th></tr>
      ${r.segments.map((x) => `<tr><td>${esc(x.title || x.scene)}</td><td>${x.fps.toFixed(1)}</td><td>${x.low1Fps.toFixed(1)}</td><td>${x.p99Ms.toFixed(1)}</td><td>${x.maxMs.toFixed(0)}</td><td>${x.hitches}</td><td>${x.gpuMs.toFixed(1)}</td><td>${x.cpuMs.toFixed(1)}</td><td>${Math.round(x.scaleAvg * 100)}%</td><td>${Math.round(x.loadMs)}</td></tr>`).join('')}</table>
      <div class="row"><button id="bCopy">Copy results</button><button id="bSave">Save file</button>${TRACKER.startsWith('http') ? '<button id="bTrack">Open the tracker</button>' : ''}<button id="bClose">Close</button></div>
      <div style="margin-top:8px;color:var(--dim)">Copy the results and paste them into the chat with Claude (or save the file and send it): Claude adds every run to the tracker and to the repo's perf/ folder.</div>`;
    box.style.display = 'block';
    const text = JSON.stringify(r);
    document.getElementById('bCopy').onclick = async (e) => { try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; } catch (x) { prompt('Copy the results:', text); } };
    document.getElementById('bSave').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = 'loop3d-bench-' + r.when.slice(0, 19).replace(/[:T]/g, '-') + '.json'; a.click(); };
    const t = document.getElementById('bTrack'); if (t) t.onclick = () => open(TRACKER, '_blank');
    document.getElementById('bClose').onclick = () => { box.style.display = 'none'; };
  }
  // the live graph: tap the stats to show the last 240 frames' times
  const graph = document.getElementById('graph'), gctx = graph.getContext('2d');
  let graphOn = false;
  document.getElementById('stats').onclick = () => { graphOn = !graphOn; graph.style.display = graphOn ? 'block' : 'none'; if (graphOn) drawGraph(); };
  function drawGraph() {
    if (!graphOn) return;
    if (M) {
      const p = M._loop_perf_graph() >> 2, v = M.HEAPF32.subarray(p, p + 240), W = 480, H = 180, top = 50;
      gctx.clearRect(0, 0, W, H);
      gctx.fillStyle = 'rgba(255,220,170,0.25)';
      for (const ms of [16.7, 33.3]) { const y = H - ms / top * H; gctx.fillRect(0, y, W, 1); }
      gctx.fillStyle = '#b9ae9c'; gctx.font = '18px ui-monospace, monospace';
      gctx.fillText('16.7 ms', 4, H - 16.7 / top * H - 4); gctx.fillText('33 ms', 4, H - 33.3 / top * H - 4);
      for (let i = 0; i < 240; i++) {
        const ms = v[i]; if (!ms) continue;
        gctx.fillStyle = ms > 33.4 ? '#ff6b5c' : ms > 17.5 ? '#ffb35c' : '#8fd18f';
        const h = Math.min(H, ms / top * H); gctx.fillRect(i * 2, H - h, 2, h);
      }
    }
    requestAnimationFrame(drawGraph);
  }
  window.loopStarted = (title, mode, shots) => {
    document.getElementById('title').textContent = title;
    movie = mode === 'movie' && shots > 0;
    modeBtn.disabled = shots === 0;
    setMode(movie);
  };
  window.loopReady = async () => {
    const q = document.getElementById('quality');
    q.value = params.get('quality') || (touch ? '0' : '1');
    q.onchange = () => { M._loop_set_quality(+q.value); q.blur(); };
    M._loop_set_quality(+q.value);
    const sc = document.getElementById('scene');
    // the scene picker lists every project's scenes (scenes/index.json, made by tools/build_projects.py)
    try {
      const idx = index = await (await fetch('scenes/index.json')).json();
      sc.innerHTML = '';
      for (const p of idx.projects) {
        const g = document.createElement('optgroup'); g.label = p.title;
        for (const s of p.scenes) { const o = document.createElement('option'); o.value = s.name; o.textContent = s.title; g.appendChild(o); }
        sc.appendChild(g);
      }
    } catch (e) { /* keep the built-in entry */ }
    if (![...sc.options].some((o) => o.value === sceneName)) { const o = document.createElement('option'); o.value = o.textContent = sceneName; sc.appendChild(o); }
    if (fromEditor && fromEditor.scene === sceneName) document.getElementById('title').textContent = 'From the editor: ' + sceneName;
    LoopUI.gamepad(() => M, useIt, () => { if (movie) setMode(false); });
    LoopUI.pauseWhenHidden(() => M);
    setInterval(() => LoopUI.applyPage(M, { hud: [...document.querySelectorAll('.bar')] }), 1000);
    sc.value = sceneName;
    sc.onchange = () => { sc.blur(); location.hash = sc.value; window.loopGoTo(sc.value); };
    document.getElementById('benchSel').onchange = (e) => {
      const kind = e.target.value; e.target.value = ''; e.target.blur();
      if (!kind) return;
      useProject(sceneName);
      const u = new URLSearchParams(location.search); u.set('bench', kind); u.set('quality', q.value);
      location.href = location.pathname + '?' + u.toString() + '#' + (kind === 'story' && sceneName.startsWith('ardane_') ? 'ardane_01_home' : sceneName);
    };
    if (bench) {
      M._loop_set_autoplay(1);
      benchBegin(sceneName);
      benchStarted = performance.now();
      benchUse = setInterval(() => { if (!movie) useIt(); const l = document.getElementById('benchLive'); l.style.display = 'block'; l.textContent = 'Benchmark ' + qualityNames[+q.value] + ' · scene ' + (benchSegments.length + 1) + ' · ' + Math.round((performance.now() - benchStarted) / 1000) + ' s'; }, 500);
    }
    try {
      await loadScene(sceneName);
    } catch (e) {
      showNote('Couldn\'t load the scene "' + sceneName + '".', false);
    }
    setInterval(() => {
      try {
        const s = JSON.parse(M.UTF8ToString(M._loop_stats()));
        document.getElementById('stats').textContent = (s.fps || 0).toFixed(0) + ' fps · ' + (s.gpu || 0).toFixed(1) + ' ms gpu · ' + (s.cpu || 0).toFixed(1) + ' ms cpu · ' + Math.round((s.scale || 1) * 100) + '% res · ' + s.things + ' things';
      } catch (e) {}
    }, 500);
  };
  function setMode(m) {
    movie = m;
    modeBtn.textContent = movie ? 'Movie' : 'Game';
    modeBtn.classList.toggle('on', movie);
    document.body.classList.toggle('game', !movie);
    if (M) M._loop_set_mode(movie ? 1 : 0);
  }
  modeBtn.onclick = () => setMode(!movie);
  const useIt = () => { if (M) { const n = M.lengthBytesUTF8('use') + 1, p = M._malloc(n); M.stringToUTF8('use', p, n); M._loop_emit(p); M._free(p); } };
  document.getElementById('useBtn').onclick = useIt;
  addEventListener('keydown', (e) => {
    // a menu that still has focus after a click would take these keys too
    // (the arrows change the quality, E jumps to a scene, and both reload)
    if (!M) return;
    const use = LoopUI.useKey(M);
    if ((e.code in LoopUI.keyMap(M) || e.code === use) && e.target instanceof HTMLSelectElement) e.preventDefault();
    if (e.code === use && !e.repeat) useIt();
  });
  // sound: the engine mixes; the page just hands the samples to the speakers
  let audioCtx = null;
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.onclick = () => {
    if (!M) return;
    if (audioCtx) { audioCtx.close(); audioCtx = null; soundBtn.classList.remove('on'); return; }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    const frames = LoopUI.setting(M, 'audio.buffer', 2048), node = audioCtx.createScriptProcessor(frames, 0, 2);
    const ptr = M._malloc(frames * 2 * 4);
    node.onaudioprocess = (e) => {
      M._loop_audio(ptr, frames);
      const buf = M.HEAPF32.subarray(ptr >> 2, (ptr >> 2) + frames * 2);
      const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
      for (let i = 0; i < frames; i++) { L[i] = buf[i * 2]; R[i] = buf[i * 2 + 1]; }
    };
    node.connect(audioCtx.destination);
    soundBtn.classList.add('on');
  };
  trailerBtn.onclick = () => {
    showTrailer = !showTrailer;
    trailer.style.display = showTrailer ? 'block' : 'none';
    trailerBtn.classList.toggle('on', showTrailer);
    trailerBtn.textContent = showTrailer ? 'Live view' : 'Trailer view';
  };
  trailer.onerror = () => { trailerBtn.disabled = true; trailerBtn.title = 'No cinema render for this scene yet'; };

  // keyboard: W A S D / arrows, shift to run
  // walking keys from the settings (keys.forward …), arrows always
  addEventListener('keydown', (e) => { if (!M) return; const km = LoopUI.keyMap(M); if (e.code in km) { M._loop_key(km[e.code], 1); if (movie) setMode(false); } });
  addEventListener('keyup', (e) => { if (!M) return; const km = LoopUI.keyMap(M); if (e.code in km) M._loop_key(km[e.code], 0); });
  // mouse: drag to look
  const view = document.getElementById('view');
  let dragging = false, lx = 0, ly = 0;
  view.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') { dragging = true; lx = e.clientX; ly = e.clientY; } });
  addEventListener('pointerup', () => dragging = false);
  addEventListener('pointermove', (e) => {
    if (!dragging || !M || movie) return;
    M._loop_look(e.clientX - lx, e.clientY - ly);
    lx = e.clientX; ly = e.clientY;
  });
  // touch: left thumb walks, right thumb looks
  function stick(el, onMove, isLook) {
    let id = null, cx = 0, cy = 0, px = 0, py = 0;
    const knob = el.querySelector('i');
    el.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0]; id = t.identifier;
      const r = el.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; px = t.clientX; py = t.clientY;
      e.preventDefault();
    }, { passive: false });
    el.addEventListener('touchmove', (e) => {
      for (const t of e.changedTouches) if (t.identifier === id) {
        let dx = t.clientX - cx, dy = t.clientY - cy;
        const d = Math.hypot(dx, dy), m = 50;
        if (d > m) { dx *= m / d; dy *= m / d; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        if (isLook) { onMove(t.clientX - px, t.clientY - py); px = t.clientX; py = t.clientY; }
        else onMove(dx / m, -dy / m);
      }
      e.preventDefault();
    }, { passive: false });
    const end = (e) => { for (const t of e.changedTouches) if (t.identifier === id) { id = null; knob.style.transform = ''; if (!isLook) onMove(0, 0); } };
    el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  }
  stick(document.getElementById('ls'), (x, y) => M && M._loop_move(x, y), false);
  stick(document.getElementById('rs'), (dx, dy) => { if (M) { const k = LoopUI.setting(M, 'player.touchLook', 1.6); M._loop_look(dx * k, dy * k); } }, true);

  window.Module = { onRuntimeInitialized() { M = window.Module; } };
  const s = document.createElement('script');
  s.src = 'player.js';
  s.onerror = () => showNote('Couldn\'t load the engine (player.js).', false);
  document.body.appendChild(s);
})();
</script>
</body>
</html>
