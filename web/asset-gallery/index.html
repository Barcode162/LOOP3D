<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Library · LOOP3D</title><link rel="stylesheet" href="gallery.css"></head><body>
<header><div class="brand"><i></i> LOOP<span>3D</span></div><div class="section">Asset library</div><a class="pack" download href="Loft-assets.zip">↓ &nbsp; Loft bundle</a></header>
<main><section class="hero"><div><h1>Asset library</h1><p>400 assets across 3 collections</p></div></section>
<section class="toolbar"><label class="search">⌕ <input id="search" type="search" aria-label="Search assets" placeholder="Search assets"></label><label>Collection <select id="collection"><option value="">All collections</option></select></label><label>Category <select id="category"><option value="">All categories</option></select></label><label>Room shortlist <select id="roomFilter"><option value="">All assets</option></select></label></section>
<div class="summary"><h2 id="heading">All assets</h2><span id="count"></span></div><div id="grid"></div></main>
<dialog id="viewer"><div class="viewhead"><span id="position"></span><button id="close" aria-label="Close inspector">×</button></div><div id="stage"><button id="previous" aria-label="Previous asset">‹</button><img id="preview" alt=""><button id="next" aria-label="Next asset">›</button></div><div class="details"><small id="meta"></small><h2 id="title"></h2><p id="filename"></p><p id="dimensions"></p><div class="actions"><button id="angle">Second angle</button><a id="download" download>Download file</a></div>
<details id="placement"><summary>Placement code</summary><pre id="snippet" tabindex="0"></pre><button id="copy">Copy placement</button></details>
<div class="actions rooms"><label>Room <select id="roomTarget"></select></label><button id="saveRoom"></button></div>
<p class="hint">Room shortlists are saved in this browser.</p><span id="status" role="status"></span></div></dialog>
<script src="assets.js"></script><script src="dimensions.js"></script><script src="gallery.js"></script></body></html>
