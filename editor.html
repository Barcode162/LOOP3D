<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Loop3D Editor</title>
<meta name="loop-build" content="c0f94fa 2026-11-06">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="editor/editor.css">
</head>
<body>
<div id="app">
  <!-- the top: the menu, the scene, undo and redo, Play -->
  <header id="top">
    <button id="menuBtn" class="ib" aria-label="Menu" title="Menu"></button>
    <button id="sceneBtn" class="scene" title="Open another scene">
      <span id="sceneTitle">Loop3D</span><small id="projTitle">Loading…</small>
    </button>
    <span class="spacer"></span>
    <span id="savedDot" class="saved" title="Every change is kept in this browser the moment you make it"></span>
    <button id="undoBtn" class="ib" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button>
    <button id="redoBtn" class="ib" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled></button>
    <button id="playBtn" class="play" title="Play: walk around in the world (P). Your changes stay."><span class="lbl">Play</span></button>
  </header>

  <!-- the world, always: the engine draws it; the overlay draws the selection and handles -->
  <main id="stage">
    <canvas id="view" tabindex="0"></canvas>
    <canvas id="overlay"></canvas>
    <div id="touch" aria-label="The world: tap to pick a thing, drag to move it, two fingers to move the view"></div>
    <div id="vpNote" class="loading">Loading Loop3D…</div>
    <div id="speed" title="Frames a second and the time each one takes"></div>
    <div id="hint"></div>
    <div id="lines"></div>
    <div id="ask"></div>
    <div class="stick" id="ls"><i></i></div>
    <div class="stick" id="rs"><i></i></div>
  </main>

  <!-- the four spaces; the sheet shows the one picked -->
  <nav id="spaces" role="tablist" aria-label="Spaces">
    <button data-space="build" role="tab"><span class="lbl">Build</span></button>
    <button data-space="logic" role="tab"><span class="lbl">Logic</span></button>
    <button data-space="film" role="tab"><span class="lbl">Film</span></button>
    <button data-space="sound" role="tab"><span class="lbl">Sound</span></button>
  </nav>
  <section id="sheet" aria-live="polite">
    <div id="grip" title="Drag to make the sheet taller or shorter"><i></i></div>
    <div id="sheetBody"></div>
  </section>
</div>

<div id="menuRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="isolate.js"></script>
<script src="loop_ui.js"></script>
<script src="editor/words.js"></script>
<script src="editor/settings_schema.js"></script>
<script src="editor/icons.js"></script>
<script src="editor/ui.js"></script>
<script src="editor/engine.js"></script>
<script src="editor/source.js"></script>
<script src="editor/history.js"></script>
<script src="editor/view.js"></script>
<script src="editor/spaces.js"></script>
<script src="editor/editor.js"></script>
</body>
</html>
